name: carrier-canary

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compare pinned carriers with upstream tags
        id: check
        run: python3 frontend/check-carriers.py --github-output "$GITHUB_OUTPUT" --markdown carrier-update.md

      - name: Open or update the carrier update issue
        if: steps.check.outputs.outdated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create carrier-update \
            --color FBCA04 \
            --description "A carrier newer than the pinned version is available" \
            2>/dev/null || true
          number=$(gh issue list --state open --label carrier-update --limit 1 --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file carrier-update.md
          else
            gh issue create --title "Carrier update available" --label carrier-update --body-file carrier-update.md
          fi
